<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボートレースAI予想</title>
<meta name="description" content="Boatrace Open API のデータを使った機械学習によるボートレース予想">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header>
  <div class="wrap head">
    <h1>ボートレースAI予想</h1>
    <div class="date-nav">
      <button id="prev-day" type="button" aria-label="前の日">◀</button>
      <input id="date" type="date" aria-label="日付">
      <button id="next-day" type="button" aria-label="次の日">▶</button>
    </div>
  </div>
</header>

<main class="wrap">
  <p id="day-note" class="day-note" hidden></p>
  <div id="status" class="status" hidden>
    <span id="updated" class="muted"></span>
    <span id="update-msg" class="muted"></span>
    <button id="refresh" type="button">↻ 更新</button>
  </div>
  <div class="picker">
    <div class="picker-row"><span class="picker-label">レース場</span><nav id="stadiums" class="tabs" aria-label="レース場"></nav></div>
    <div class="picker-row"><span class="picker-label">レース</span><nav id="race-tabs" class="tabs races-tabs" aria-label="レース"></nav></div>
  </div>
  <section id="races"></section>
  <p id="empty" class="muted" hidden>この日の予想はありません。</p>
</main>

<footer class="wrap muted">
  <p>データ: <a href="https://github.com/BoatraceOpenAPI">Boatrace Open API</a>、オッズ: <a href="https://www.boatrace.jp/">BOATRACE公式サイト</a>（推奨買い目の取得時点オッズのみ掲載。最新のオッズは公式サイトでご確認ください）。
  予想は統計モデルの出力であり、的中や利益を保証するものではありません。舟券の購入は自己責任で、20歳以上の方に限られます。</p>
  <p id="model-info"></p>
</footer>

<template id="race-tpl">
  <article class="race">
    <header class="race-head">
      <div><strong class="race-no"></strong> <span class="race-title muted"></span></div>
      <div class="race-meta"><span class="badge model"></span> <span class="closed muted"></span></div>
    </header>
    <table class="boats">
      <thead><tr><th>枠</th><th>選手</th><th class="num hide-sm">勝率</th><th class="num hide-sm" title="今節の平均着順（走数）">今節</th><th class="num hide-sm" title="今節・直近・コース別から推定したスタートタイミング">予想ST</th><th class="num hide-sm" title="展示タイム（括弧内はコース補正後のレース内偏差、マイナスほど良い）">展示</th><th>1着確率</th><th class="num">3着内</th></tr></thead>
      <tbody></tbody>
    </table>
    <details class="legend">
      <summary>項目の説明</summary>
      <dl>
        <dt>枠</dt><dd>艇番（枠番）。色は艇番ごとの公式カラー。</dd>
        <dt>選手</dt><dd>選手名と級別（A1 → A2 → B1 → B2 の順に上位）。</dd>
        <dt>勝率</dt><dd>全国勝率。1着10点・2着8点・3着6点・4着4点・5着2点・6着1点の1走あたり平均点（今期の成績）。</dd>
        <dt>今節</dt><dd>いま開催中の節（同じレース場で4〜7日間続くシリーズ）で、前日までに走ったレースの平均着順。括弧内は走った回数。小さいほど好調。節の初日は「-」。</dd>
        <dt>予想ST</dt><dd>予想されるスタートタイミング（秒）。今節の平均ST（2走以上）→ 直近90日 → 期別平均の順に使い、このコースでのST（過去1年5走以上）があればそれを優先。小さいほど早い。</dd>
        <dt>展示</dt><dd>展示航走のタイム（秒）。括弧内はコース補正後の値：レース内平均との差から、そのレース場・コースのいつもの差（過去1年）を引いたもの。マイナスほど良い。展示前は「-」。</dd>
        <dt>1着確率</dt><dd>AI が予想した1着になる確率（6艇の合計100%）。</dd>
        <dt>3着内</dt><dd>3着以内に入る確率。</dd>
        <dt>イン1着率</dt><dd>このレース場で過去1年に1コースの艇が1着になった割合。</dd>
        <dt>出走表のみ / 直前情報あり</dt><dd>予想に展示タイム・進入コースなどの直前情報を使ったかどうか。展示後に「↻ 更新」を押すと直前情報ありの予想に切り替わる。</dd>
        <dt>3連単 確率上位20点</dt><dd>1着確率から計算した、3連単の各組み合わせの確率の上位20点。</dd>
        <dt>期待値 推奨</dt><dd>当たる確率 × オッズ（期待値）が1.2以上の買い目（最大3点）。締切25分前以降のオッズで計算。</dd>
      </dl>
    </details>
    <div class="tri-box"><h3>3連単 確率上位20点</h3><ol class="tri"></ol></div>
    <div class="picks">
      <div class="ev"><h3>期待値 推奨</h3><ul class="ev-list"></ul></div>
      <div class="result"></div>
    </div>
  </article>
</template>

<script src="app.js?v=8"></script>
</body>
</html>
