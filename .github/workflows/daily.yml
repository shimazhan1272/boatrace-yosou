# 毎朝 06:00 JST: 前日分の過去データ（出走表・直前情報・結果）を取り込み、前日の予想の結果を確定させる。
# 前日までのデータでモデルを再学習し、オッズの無い過去レースの締切時オッズを1日400件までさかのぼって取得する
name: daily data

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # push で起動した場合も最新の main を使う（直前の定期実行のコミットを取り込むため）
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/beforeinfo
            data/context
            data/odds
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: python -m boatrace daily

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data models
          git diff --cached --quiet || git commit -m "daily data $(TZ=Asia/Tokyo date '+%F')"
          git pull --rebase -X theirs  # 競合したら今回生成したデータを優先
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
