# 開催時間中、定期的に予想を更新して docs/ を GitHub Pages に公開する
name: update predictions

on:
  schedule:
    # 08:00〜21:40 JST に20分おき（cron は UTC）
    - cron: "*/20 23 * * *"
    - cron: "*/20 0-12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # 場×コース等の集計に過去1年分の結果を使うので、APIキャッシュを使い回す
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: python -m boatrace update

      # 予想と成績の履歴はリポジトリに残す
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "update predictions $(TZ=Asia/Tokyo date '+%F %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
