# 開催時間中、定期的に予想を更新して docs/ を GitHub Pages に公開する
name: update predictions

on:
  schedule:
    # 08:00〜21:50 JST に10分おき（cron は UTC）。GitHub の都合で数分〜十数分遅れることがある
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-12 * * *"
  workflow_dispatch:
  # コードや画面を変更して push したときも公開し直す（予想データの自動コミットでは起動しない）
  push:
    branches: [main]
    paths-ignore: ["docs/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # 場×コース等の集計に過去1年分の結果を使うので、APIキャッシュを使い回す
      # （公式サイトから取った直前情報も、同じレースを取り直さないよう保存しておく）
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/beforeinfo
            data/context
            data/odds
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: python -m boatrace update

      # 予想と成績の履歴はリポジトリに残す
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "update predictions $(TZ=Asia/Tokyo date '+%F %H:%M')"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
